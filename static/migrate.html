<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知伴 · 本地数据迁移</title><link rel="stylesheet" href="/style.css"></head><body><div class="portal"><section class="panel"><h1>迁移原版本地学习数据</h1><p>此页面只读取当前浏览器的旧版本地数据，不会上传服务器。请使用以前演示时相同的浏览器和地址（包括端口）打开。</p><button class="primary" id="export">导出本地数据备份</button><p id="result" role="status"></p><p>之后启动独立客户端，在「学习记录」中选择「导入设备备份」。</p><a href="/">返回服务器首页</a></section></div><script>
document.querySelector('#export').onclick=()=>{try{const raw=localStorage.getItem('zhiban-device-v1');if(!raw)throw Error('此浏览器和地址下没有旧版本地数据，请确认使用原来的浏览器、地址和端口。');const data=JSON.parse(raw);if(data.schema!==1)throw Error('数据格式不支持');const url=URL.createObjectURL(new Blob([JSON.stringify({kind:'zhiban-device-backup',exportedAt:new Date().toISOString(),data},null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='知伴设备备份.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);document.querySelector('#result').textContent='备份已导出，请在新客户端中导入。';}catch(e){document.querySelector('#result').textContent=e.message;}};
</script></body></html>
